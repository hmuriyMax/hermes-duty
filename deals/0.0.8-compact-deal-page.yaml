# Дело: этапы и попытки — один тонкий столбец рядом с описанием
#
# Правка вида, а не поведения: на странице дела две панели рассказывают об одних и тех же
# попытках (широкая «этапы» с доказательствами и отдельная «попытки» карточками с журналом),
# шапка попытки повторяется в обеих, страница выросла до трёх с половиной экранов.
#
# Тело дела (`BODY-compact-deal-page.md`) — точная спека вида и разделение работы по этапам:
# в нём сказано, что делает `shape`, что делает `layout` и что нельзя трогать ни одному.
#
# ПОЧЕМУ ДВА ЭТАПА РЕАЛИЗАЦИИ, А НЕ ОДИН (дело `d_eb4ad2bb`). Первое дело этой правки шло
# одним 90-минутным этапом и сгорело целиком: воркер сделал шейпер, обе поверхности и CSS,
# доводил тесты — и не уложился в бюджет. Дерево попытки удаляется вместе с попыткой, коммита
# не было, `result.json` тоже: работа пропала без следа. Отсюда две правки в графе:
#   1. работа разрезана по шву «шейпер / поверхности» — каждый этап коммитит своё, и таймаут
#      одного не уносит работу другого;
#   2. в теле дела прямо сказано: сначала рабочий вариант с коммитом и отчётом, полировка —
#      после. Готовый отчёт сильнее потолка, но только если он вообще был записан.
#
# base приколот к коммиту, на котором страница уже говорит словами и показывает спеку
# (`00819b1`): новое дерево после правок — новое дело, продолжение старого перегонит
# прежний base.
#
# Адреса приговора: `next` (дальше) и `layout` (вернуть поверхности на доработку). Чужих
# имён в этой спеке нет намеренно: ревьюер адресует приговор тем, что видит в графе.

duty: 0.0.8-compact-deal-page
repo: ~/.hermes/plugins/hermes-duty
base: 00819b1

budget: {minutes: 240}

stages:
  - id: shape
    role: implementer
    workspace: worktree
    budget: {minutes: 45}
    evidence:
      - {cmd: "node --test tests/model.test.mjs", must: 0, timeout_sec: 300}
      - {cmd: "env -u PYTHONPATH bin/duty-model-sync --check", must: 0, timeout_sec: 120}

  - id: layout
    role: implementer
    needs: [shape]
    workspace: worktree
    budget: {minutes: 60}
    evidence:
      - {cmd: "node --test tests/model.test.mjs tests/web.test.mjs tests/desktop-render.test.mjs", must: 0, timeout_sec: 300}
      - {cmd: "env -u PYTHONPATH bin/duty-model-sync --check", must: 0, timeout_sec: 120}

  - id: check
    kind: shell
    needs: [layout]
    workspace: worktree
    cmd: "node --test tests/*.test.mjs && env -u PYTHONPATH bin/duty-model-sync --check && env -u PYTHONPATH /Users/mshchemilkin/.hermes/hermes-agent/venv/bin/python -m pytest tests/ -q -p no:randomly && env -u PYTHONPATH /Users/mshchemilkin/.hermes/hermes-agent/venv/bin/hermes plugins validate ."
    must: 0
    budget: {minutes: 30}

  - id: review
    role: reviewer
    needs: [check]
    workspace: worktree
    # Первый приговор перечисляет не все места сразу, поэтому раундов два: правки между ними
    # вносит исполнитель тем же деревом. `retry` на `contract` — чтобы кривой адрес приговора
    # не тратил раунд.
    verdict: {approve: next, changes: layout, max_rounds: 2}
    retry: {max: 1, on: [contract]}
    budget: {minutes: 60}

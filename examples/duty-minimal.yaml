# Спека дела — минимум, при котором дело уже имеет смысл: два этапа и один
# приговор. Проверяется тем же тестом и той же командой:
# `bin/duty spec check examples/duty-minimal.yaml`.
#
# Чего здесь нет и почему это законно:
#   repo/base     — дерево не нужно ни одному этапу: у `review` оно выключено
#                   явно (`workspace: none`). Умолчание для этапа с
#                   предшественником — `worktree` (цепочка «сделал → проверил →
#                   принял» иначе неисполнима), а отводить дерево здесь не от
#                   чего: repo/base не объявлены;
#   evidence      — этап без доказательств допустим (движку тогда нечего проверять);
#   ask/budget    — вопросов и бюджета спека не объявляет;
#   parallel_with — этапы идут строго по цепочке needs.
#
# Что остаётся обязательным: единственный вход (`impl` без needs), все этапы
# достижимы от него, `verdict.changes` ведёт назад к предшественнику (иначе
# возврат на доработку перескочил бы ревью).
#
# `review` с `workspace: none` видит только каталог попытки — работы `impl` там
# нет. Для настоящей цепочки объявляются `repo`/`base` и `workspace: worktree`
# (умолчание этапа с `needs`); явный `none` — выбор этапа, который ничего не
# проверяет по дереву (например, только спрашивает человека).

duty: fix-typo-in-header
stages:
  - id: impl
    role: implementer

  - id: review
    role: reviewer
    needs: [impl]
    workspace: none
    verdict: {approve: next, changes: impl, max_rounds: 1}
